<!doctype html>
<meta charset="utf-8">
<title>Decision Arena — Versus Tetris</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="./match.css">
<body>
<header class="top">
  <div class="title">테트리스 대전 <small>줄을 지우면 상대 바닥에 방해줄이 올라갑니다</small></div>
  <div class="seed">시드 <b id="seed"></b> · 같은 블록 순서</div>
  <div class="turn">턴 <b id="turn">0</b></div>
</header>
<main class="arena">
  <section class="side" id="A"></section>
  <div class="vs">VS</div>
  <section class="side" id="B"></section>
</main>
<footer class="safe"></footer>
<template id="side-t">
  <div class="head"><b class="name"></b><span class="who"></span><span class="verdict"></span></div>
  <div class="body">
    <div class="well"></div>
    <div class="rail">
      <div class="plan"><label>이번 판단</label><b class="plan-now">—</b><span class="conf"></span></div>
      <div class="danger"><label>스스로 본 위험도</label><i><em></em></i><b class="dv">—</b></div>
      <div class="stats">
        <div><span data-k="lines">0</span><label>지운 줄</label></div>
        <div><span data-k="sent">0</span><label>보낸 방해줄</label></div>
        <div><span data-k="recv">0</span><label>받은 방해줄</label></div>
        <div><span data-k="ms">—</span><label>응답 시간</label></div>
      </div>
      <ol class="log"></ol>
    </div>
  </div>
</template>
<script type="module" src="./match.js"></script>
