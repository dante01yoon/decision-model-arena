<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>body{margin:0;width:1280px;height:800px;font-family:Pretendard;background:#f3f4f7}
.chrome{height:64px;background:#e3e5ea;display:flex;align-items:center;gap:14px;padding:0 18px}
.dots i{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:7px;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.url{flex:1;background:#fff;border-radius:10px;padding:10px 16px;font-size:18px;color:#333}
.page{display:flex;justify-content:center;padding-top:40px}
.card{width:520px;background:#fff;border-radius:18px;padding:36px 40px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.logo{font-size:34px;font-weight:800;color:#7a4a1e}.logo span{color:#c98a3c}
label{display:block;margin:18px 0 6px;font-size:16px;color:#555}input{width:100%;box-sizing:border-box;height:46px;border:1px solid #ccd;border-radius:10px}
button{margin-top:26px;width:100%;height:52px;border:0;border-radius:12px;background:#7a4a1e;color:#fff;font:700 19px Pretendard}
.warn{background:#ffe1e1;color:#c00;font-weight:700;padding:12px 16px;border-radius:10px;margin-top:18px;font-size:16px}
</style><body><div class="chrome"><span class="dots"><i></i><i></i><i></i></span><div class="url">🔒 https://www.dotoribank.co.kr/login</div></div>
<div class="page"><div class="card"><div class="logo">🌰 도토리<span>은행</span></div>
<label>아이디</label><input><label>비밀번호</label><input type="password"><button>로그인</button></div></div></body>
